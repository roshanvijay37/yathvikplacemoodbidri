# Fails (red X on the commit, email to the repo owner) if content.js was
# edited without re-running the build, so the page source never drifts from it.
name: Check generated files
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.mjs --check
