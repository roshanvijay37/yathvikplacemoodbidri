<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yathvik Place, Moodbidri</title>

<style>
  :root { --bg:#faf8f4; --fg:#1d1b18; --muted:#6b655c; --accent:#9a6b2f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12110f; --fg:#f1ede6; --muted:#a39c90; --accent:#d9a45b; } }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; }
  .kicker { color:var(--accent); letter-spacing:.2em; text-transform:uppercase; font-size:.8rem; font-weight:600; }
  h1 { font-size:clamp(2rem,7vw,3.5rem); line-height:1.1; margin:.4em 0 .3em; font-weight:700; }
  p { color:var(--muted); }
</style>
</head>
<body>
  <main>
    <div class="kicker">Moodbidri</div>
    <h1>Yathvik Place</h1>
    <p>Our website is coming soon.</p>
  </main>
